<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12100e" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2312100e'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ff2d78'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23ffb020'/%3E%3C/svg%3E"
    />
    <meta name="description" content="STRATA — restore Paradise, NV. One cell at a time." />
    <title>clvi-game-client</title>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <header class="hud hud-top">
      <div class="brand">
        <strong>clvi-game-client</strong>
        <span id="build-stamp" class="dim"></span>
      </div>
      <div class="stats">
        <span id="stat-restored">0 / 0 restored</span>
        <span id="stat-feed" class="dim">feed idle</span>
      </div>
    </header>

    <div id="notice" class="notice" role="status" aria-live="polite"></div>

    <footer class="hud hud-bottom">
      <div id="readout" class="readout">Press and hold a cell to dig.</div>
      <div class="controls">
        <button id="btn-bloom" type="button">Bloom cell</button>
        <button id="btn-zoom-out" type="button" aria-label="Zoom out">&minus;</button>
        <button id="btn-zoom-in" type="button" aria-label="Zoom in">+</button>
      </div>
    </footer>

    <div id="card-layer" class="card-layer" hidden>
      <article id="card" class="card" role="dialog" aria-modal="true" aria-labelledby="card-name">
        <div class="card-rarity" id="card-rarity"></div>
        <h2 class="card-name" id="card-name"></h2>
        <p class="card-era" id="card-era"></p>
        <p class="card-blurb" id="card-blurb"></p>
        <dl class="card-stats" id="card-stats"></dl>
        <p class="card-energy" id="card-energy"></p>
        <button id="card-close" type="button">Keep digging</button>
      </article>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
